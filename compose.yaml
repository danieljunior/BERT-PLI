version: "3.8"

services:
  bert-pli:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        CUDA_IMAGE: nvidia/cuda:13.0.3-cudnn-devel-ubuntu22.04
        PYTORCH_GIT_REF: main
        TORCH_CUDA_ARCH_LIST: "12.0"
        MAX_JOBS: "4"
    image: bert-pli:cuda130-src
    container_name: bert-pli
    volumes:
      - ./:/app
      - /home/danieljunior/workspace/datasets/jurídicos/COLIEE dataset/:/app/data/COLIEE
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    shm_size: 5gb
